
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Serve JavaScript, CSS, and other built assets directly.
    location /assets/ {
        try_files $uri =404;
    }

    # Support React Router and other frontend routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
